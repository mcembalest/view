[project]
name = "view"
version = "0.1.0"
description = "Point at a folder, see its files as a semantic map in 2D and 3D."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "pillow-heif",
    "torch",
    "open_clip_torch",
    "timm",
    "sentence-transformers",
    "umap-learn @ git+https://github.com/lmcinnes/umap@c6a17a66d8c4d48530fde3df12b4229f2df27805",
    "evoc",
    "matplotlib",  # evoc imports it at load time
    "pathspec",
    "typesafe-sdk",
]

[project.scripts]
view = "view.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["view"]
